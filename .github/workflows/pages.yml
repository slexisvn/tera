name: Deploy site, notebook, and visualizer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tera
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build tera browser bundles
        run: npm run build

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Build notebook
        run: npm run nb:build

      - name: Build visualizer
        run: npm run viz:build

      - name: Assemble Pages site
        run: |
          rm -rf pages
          mkdir -p pages/notebook pages/visualizer
          cp -r site/dist/. pages/
          cp -r tools/notebook/dist/. pages/notebook/
          cp -r tools/visualizer/dist/. pages/visualizer/
          touch pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
